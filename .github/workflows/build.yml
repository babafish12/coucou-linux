name: Linux

on:
  push:
    branches: [main]
    tags: ['v*', 'linux-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: linux/package-lock.json

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            linux/target
          key: linux-cargo-${{ runner.os }}-${{ hashFiles('linux/Cargo.lock') }}
          restore-keys: linux-cargo-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci

      - name: Check and build frontend
        run: npm run build

      - name: Test frontend
        run: |
          node scripts/test-island-performance.mjs
          node scripts/test-codex-activity.mjs
          node scripts/test-telegram-inline.mjs

      - name: Test Rust backend
        run: cargo test --workspace --locked

      - name: Test installer and launcher
        working-directory: .
        run: python3 scripts/test-coucou-launcher.py

      - name: Build Linux release executable
        run: npm run tauri -- build --no-bundle
